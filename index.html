<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>市場採買日</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one card per station, full-width tap targets, daytime market palette */
:root{
  --bg:#fbf6ec; --paper:#ffffff; --fg:#2b2419; --muted:#6f6353;
  --accent:#c8551b; --accent-ink:#ffffff; --line:#e6dccb;
  --ok:#2e7d4f; --warn:#b7791f; --bad:#b3261e; --sel:#fde8d8;
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1813; --paper:#2a241c; --fg:#f3ebdd; --muted:#b8aa94; --accent:#e8793a; --accent-ink:#1c1813;
  --line:#3d3528; --ok:#5fc08a; --warn:#e0a94a; --bad:#f07a72; --sel:#4a2f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1813; --paper:#2a241c; --fg:#f3ebdd; --muted:#b8aa94; --accent:#e8793a; --accent-ink:#1c1813;
  --line:#3d3528; --ok:#5fc08a; --warn:#e0a94a; --bad:#f07a72; --sel:#4a2f1d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:20px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{font-size:22px;margin:0;font-weight:900;letter-spacing:.04em}
.hud{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--accent);font-size:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-size:26px;font-weight:900;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:17px}
button{font:inherit;font-size:22px;font-weight:700;border:2px solid var(--line);background:var(--paper);color:var(--fg);
  border-radius:16px;padding:16px 18px;cursor:pointer;min-height:64px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:24px}
button.sel{background:var(--sel);border-color:var(--accent)}
button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--paper))}
button:disabled{opacity:.6;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px;padding:12px 6px}
.item .pic{font-size:44px;line-height:1}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.seq{position:relative;width:100%;aspect-ratio:1;max-width:100%;background:var(--bg);border-radius:16px;border:1px solid var(--line)}
.seq button{position:absolute;width:64px;height:64px;min-height:0;border-radius:50%;padding:0;font-size:26px;transform:translate(-50%,-50%)}
.clockgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clockgrid button{padding:10px;min-height:0}
.clockgrid svg{width:100%;height:auto;display:block}
.score{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted);font-weight:500}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;font-size:18px;color:#fff}
.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.meter{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
.meter i{position:absolute;top:-5px;width:4px;height:24px;background:var(--fg);border-radius:2px;transform:translateX(-50%)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
input,select{font:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--fg);width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:16px;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
  padding:10px 22px;border-radius:999px;font-weight:900;font-size:24px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header><h1>🧺 市場採買日</h1><div class="hud" id="hud" hidden>得分 <b id="hudScore">0</b> / 20 · <span id="hudTime">0:00</span></div></header>
  <div id="app"></div>
  <p class="muted" style="text-align:center;font-size:14px">此遊戲只提供腦健康趨勢參考，不是醫療診斷。</p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const $=s=>document.querySelector(s), app=$('#app');
const ITEMS=[['🍎','蘋果'],['🐟','魚'],['🥚','雞蛋'],['🥬','青菜'],['🍞','麵包'],['🍌','香蕉'],['🧄','蒜頭'],['🍊','橘子'],['🥛','牛奶'],['🍚','白米']];
const DAYS=['日','一','二','三','四','五','六'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S; // session state
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),700)}
function add(n){S.score+=n;$('#hudScore').textContent=S.score;if(n>0)toast('+'+n+' 分')}
function fmt(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
let timer;function startClock(){clearInterval(timer);timer=setInterval(()=>{$('#hudTime').textContent=fmt(Date.now()-S.t0)},500)}
function view(html){app.innerHTML='<div class="card">'+html+'</div>';window.scrollTo(0,0);return app.firstElementChild}
function next(fn,delay){setTimeout(fn,delay==null?900:delay)}
function lock(c){c.querySelectorAll('button').forEach(b=>b.disabled=true)}

/* ---------- start ---------- */
function start(){
  $('#hud').hidden=true;
  const rec=load();
  const c=view(`<h2>一起去市場買菜吧</h2>
  <p class="muted">六個小關卡，大約 2 到 3 分鐘。字很大、按鈕很大，看到什麼就按什麼，不用急。</p>
  <div class="row"><label>稱呼或代號<input id="name" placeholder="例如：王阿嬤"></label></div>
  <div class="row"><label>年齡<input id="age" type="number" inputmode="numeric" placeholder="75"></label>
  <label>教育程度<select id="edu"><option value="0">國中以上</option><option value="1">國小或以下</option></select></label></div>
  <button class="primary" id="go">開始採買</button>
  ${rec.length?`<button id="recs">查看過去紀錄（${rec.length}）</button>`:''}`);
  c.querySelector('#go').onclick=()=>{
    S={name:c.querySelector('#name').value.trim()||'未填',age:c.querySelector('#age').value,edu:+c.querySelector('#edu').value,
       score:0,dom:{},t0:Date.now(),list:shuffle(ITEMS).slice(0,3),seqErr:0,rt:[]};
    $('#hud').hidden=false;$('#hudScore').textContent='0';startClock();st1();
  };
  const r=c.querySelector('#recs');if(r)r.onclick=records;
}

/* ---------- 1 採買清單：看 3 樣，馬上選出來 (3) ---------- */
function st1(){
  const c=view(`<h2>第 1 關　今天要買這三樣</h2><p class="muted">請記住它們，等一下要用。</p>
  <div class="grid3">${S.list.map(i=>`<div class="item card" style="padding:14px 6px"><span class="pic">${i[0]}</span>${i[1]}</div>`).join('')}</div>
  <div class="bar"><i id="b"></i></div>`);
  requestAnimationFrame(()=>{c.querySelector('#b').style.transition='width 6s linear';c.querySelector('#b').style.width='100%'});
  setTimeout(()=>pick('第 1 關　剛剛要買哪三樣？','imm',3,st2),6000);
}
function pick(title,key,pts,after){
  const opts=shuffle(S.list.concat(shuffle(ITEMS.filter(i=>!S.list.includes(i))).slice(0,3)));
  const chosen=new Set();
  const c=view(`<h2>${title}</h2><p class="muted">點選三樣，選好按「確定」。</p>
  <div class="grid3">${opts.map((i,k)=>`<button class="item" data-k="${k}"><span class="pic">${i[0]}</span>${i[1]}</button>`).join('')}</div>
  <button class="primary" id="ok" disabled>確定</button>`);
  c.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(chosen.has(k)){chosen.delete(k);b.classList.remove('sel')}else if(chosen.size<3){chosen.add(k);b.classList.add('sel')}
    c.querySelector('#ok').disabled=chosen.size!==3});
  c.querySelector('#ok').onclick=()=>{lock(c);let hit=0;
    c.querySelectorAll('.item').forEach(b=>{const i=opts[+b.dataset.k];const ok=S.list.includes(i);
      if(chosen.has(+b.dataset.k))b.classList.add(ok?'right':'wrong');if(ok){b.classList.add('right');if(chosen.has(+b.dataset.k))hit++}});
    const got=Math.round(hit*pts/3);S.dom[key]=got;add(got);next(after,1200)};
}

/* ---------- 2 今天幾號：星期 + 月份 (2) ---------- */
function st2(){
  const now=new Date();S.dom.ori=0;
  const c=view(`<h2>第 2 關　今天是星期幾？</h2>
  <div class="grid2">${DAYS.map((d,k)=>`<button data-k="${k}">星期${d}</button>`).join('')}</div>`);
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{lock(c);const ok=+b.dataset.k===now.getDay();
    b.classList.add(ok?'right':'wrong');if(ok){S.dom.ori++;add(1)}next(st2b)});
}
function st2b(){
  const now=new Date(),m=now.getMonth()+1;
  const opts=shuffle([m,(m%12)+1,((m+10)%12)+1,((m+5)%12)+1]);
  const c=view(`<h2>第 2 關　現在是幾月？</h2>
  <div class="grid2">${opts.map(x=>`<button data-k="${x}">${x} 月</button>`).join('')}</div>`);
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{lock(c);const ok=+b.dataset.k===m;
    b.classList.add(ok?'right':'wrong');if(ok){S.dom.ori++;add(1)}next(st3)});
}

/* ---------- 3 找零錢：2 題 (4) ---------- */
const CHANGE=[[100,35],[50,18],[100,62],[50,27],[100,47]];
function st3(){S.dom.calc=0;const qs=shuffle(CHANGE).slice(0,2);ask(0);
  function ask(i){if(i===2)return st4();const [pay,cost]=qs[i],ans=pay-cost;
    const opts=shuffle([ans,ans+10,ans-5,ans+3]);
    const c=view(`<h2>第 3 關　找零錢（${i+1}/2）</h2><p>拿 <b>${pay} 元</b> 買了 <b>${cost} 元</b> 的菜，<br>老闆要找多少錢？</p>
    <div class="grid2">${opts.map(x=>`<button data-k="${x}">${x} 元</button>`).join('')}</div>`);
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>{lock(c);const ok=+b.dataset.k===ans;
      b.classList.add(ok?'right':'wrong');if(ok){S.dom.calc+=2;add(2)}next(()=>ask(i+1))});}
}

/* ---------- 4 看時鐘：選出正確的鐘 (2) ---------- */
function clockSVG(h,m){const ha=(h%12+m/60)*30,ma=m*6;const P=(a,r)=>{const t=(a-90)*Math.PI/180;return (60+r*Math.cos(t)).toFixed(1)+','+(60+r*Math.sin(t)).toFixed(1)};
  let ticks='';for(let i=0;i<12;i++){ticks+=`<line x1="${P(i*30,50).replace(',','" y1="')}" x2="${P(i*30,55).replace(',','" y2="')}" stroke="currentColor" stroke-width="2"/>`}
  const nums=[12,3,6,9].map((n,i)=>{const [x,y]=P(i*90,42).split(',');return `<text x="${x}" y="${+y+5}" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">${n}</text>`}).join('');
  return `<svg viewBox="0 0 120 120" aria-label="時鐘"><circle cx="60" cy="60" r="57" fill="none" stroke="currentColor" stroke-width="3"/>${ticks}${nums}
  <line x1="60" y1="60" x2="${P(ha,30).replace(',','" y2="')}" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="${P(ma,46).replace(',','" y2="')}" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="currentColor"/></svg>`}
const CLOCKS=[[11,10],[3,40],[8,20],[4,45]];
function st4(){const [h,m]=CLOCKS[Math.floor(Math.random()*CLOCKS.length)];
  const wrongs=[[m/5,h*5%60],[(h+6)%12||12,m],[h,(m+30)%60]];
  const opts=shuffle([[h,m,1]].concat(wrongs.map(w=>[w[0],w[1],0])));
  const c=view(`<h2>第 4 關　哪一個鐘是 ${h} 點 ${String(m).padStart(2,'0')} 分？</h2>
  <div class="clockgrid">${opts.map((o,k)=>`<button data-k="${k}">${clockSVG(o[0],o[1])}</button>`).join('')}</div>`);
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{lock(c);const ok=opts[+b.dataset.k][2]===1;
    b.classList.add(ok?'right':'wrong');S.dom.clock=ok?2:0;if(ok)add(2);next(st5)});
}

/* ---------- 5 排隊號碼：依序點 1→6 (3) ---------- */
function st5(){
  const pos=shuffle([[18,18],[50,22],[82,18],[22,55],[58,52],[84,58],[30,84],[66,84]]).slice(0,6);
  let want=1,err=0;const t=Date.now();
  const c=view(`<h2>第 5 關　排隊號碼牌</h2><p class="muted">請依照 1、2、3… 的順序，從 1 點到 6。</p>
  <div class="seq">${pos.map((p,k)=>`<button data-n="${k+1}" style="left:${p[0]}%;top:${p[1]}%">${k+1}</button>`).join('')}</div>`);
  c.querySelectorAll('.seq button').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;
    if(n===want){b.classList.add('right');b.disabled=true;want++;
      if(want>6){S.seqMs=Date.now()-t;const got=err===0?3:err<=2?2:1;S.dom.seq=got;S.seqErr=err;add(got);next(st6)}}
    else{err++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400)}});
}

/* ---------- 6 回家對帳：延遲回憶 (6) ---------- */
function st6(){pick('第 6 關　回到家了，今天買了哪三樣？','recall',6,finish)}

/* ---------- 結果 ---------- */
function finish(){clearInterval(timer);
  const total=S.score,recall=S.dom.recall||0,adj=total+(S.edu?1:0),sec=Math.round((Date.now()-S.t0)/1000);
  let lv,txt;
  if(adj>=16&&recall>=4){lv='ok';txt='目前表現正常'}
  else if(adj>=12&&recall>=2){lv='warn';txt='建議半年後再測或追蹤'}
  else{lv='bad';txt='建議到神經內科或記憶門診進一步評估'}
  const prob=Math.round(100/(1+Math.exp(1.0*(adj-13))));
  const r={d:new Date().toISOString(),name:S.name,age:S.age,edu:S.edu,total,adj,recall,dom:S.dom,sec,seqMs:S.seqMs,seqErr:S.seqErr,lv,prob};
  save(r);
  const D=[['採買清單（即時記憶）',S.dom.imm,3],['今天幾號（定向感）',S.dom.ori,2],['找零錢（計算）',S.dom.calc,4],['看時鐘（視覺空間）',S.dom.clock,2],['排隊號碼（執行功能）',S.dom.seq,3],['回家對帳（延遲回憶）',recall,6]];
  const c=view(`<h2>採買完成！</h2>
  <div class="score">${total}<small> / 20${S.edu?'（學歷調整後 '+adj+'）':''}</small></div>
  <div><span class="pill ${lv}">${txt}</span></div>
  <table>${D.map(x=>`<tr><td>${x[0]}</td><td>${x[1]||0} / ${x[2]}</td></tr>`).join('')}
  <tr><td>總用時</td><td>${fmt(sec*1000)}</td></tr><tr><td>號碼牌用時 / 點錯</td><td>${(S.seqMs/1000).toFixed(1)} 秒 / ${S.seqErr} 次</td></tr></table>
  <p class="muted">需要進一步腦健康評估的可能性（趨勢推估）：<b>${prob}%</b></p>
  <div class="meter"><i style="left:${prob}%"></i></div>
  <p class="muted" style="font-size:14px">依總分以邏輯斯曲線推估，尚未經臨床校正；延遲回憶偏低會單獨降級。若有疑慮請以專業評估為準。</p>
  <div class="row"><button id="again">再玩一次</button><button id="recs">查看紀錄</button></div>
  <button id="copy">複製結果文字</button>`);
  c.querySelector('#again').onclick=start;c.querySelector('#recs').onclick=records;
  c.querySelector('#copy').onclick=()=>{const t=`市場採買日 ${r.d.slice(0,10)} ${r.name} ${r.age||''}歲 總分${total}/20 調整後${adj} 延遲回憶${recall}/6 ${txt} 可能性${prob}% 用時${sec}秒`;
    navigator.clipboard?.writeText(t).then(()=>toast('已複製')).catch(()=>{toast('請長按選取');c.querySelector('#copy').textContent=t})};
}
function load(){try{return JSON.parse(localStorage.getItem('market-rec')||'[]')}catch(e){return[]}}
function save(r){try{const a=load();a.unshift(r);localStorage.setItem('market-rec',JSON.stringify(a.slice(0,200)))}catch(e){}}
function records(){const a=load();$('#hud').hidden=true;
  const c=view(`<h2>過去紀錄</h2><p class="muted">只存在這支手機或電腦的瀏覽器裡。</p>
  <table>${a.map(r=>`<tr><td>${r.d.slice(5,10)}　${r.name}</td><td><span class="pill ${r.lv}" style="font-size:14px;padding:2px 10px">${r.adj}/20</span></td></tr>`).join('')||'<tr><td>還沒有紀錄</td><td></td></tr>'}</table>
  <div class="row"><button class="primary" id="back">回首頁</button>${a.length?'<button id="clr">清除全部紀錄</button>':''}</div>`);
  c.querySelector('#back').onclick=start;
  const k=c.querySelector('#clr');if(k)k.onclick=()=>{if(k.dataset.c){try{localStorage.removeItem('market-rec')}catch(e){}records()}else{k.dataset.c=1;k.textContent='再按一次確認清除'}};
}
start();
})();
</script>
</body>

</html>
